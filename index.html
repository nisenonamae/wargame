<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#253236">
<title>ウォーゲーム(仮)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --paper: #e6e9df;
  --paper-2: #d7dccd;
  --ink: #1e2b2f;
  --pencil: #687366;
  --chrome: #253236;
  --chrome-ink: #e6e9df;
  --blue: #2c5aa0;
  --red: #b03a2e;
  --grease: #d9a520;
  --line: rgba(30, 43, 47, .22);
  --shadow: 0 2px 0 rgba(30, 43, 47, .18);
  --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #232c2e;
    --paper-2: #2c3739;
    --ink: #dde3d8;
    --pencil: #9aa597;
    --chrome: #161d1f;
    --chrome-ink: #dde3d8;
    --blue: #6f9be0;
    --red: #e07a6c;
    --line: rgba(221, 227, 216, .18);
    --shadow: 0 2px 0 rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); color: var(--ink); background: var(--chrome);
  font-size: 15px; line-height: 1.55; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--grease); outline-offset: 2px; }

/* 上の帯 */
#bar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px 6px;
  background: var(--chrome); color: var(--chrome-ink);
}
#title { font-weight: 700; letter-spacing: .04em; font-size: 15px; }
#ver { font-size: 11px; opacity: .6; margin-left: 4px; font-weight: 400; }
#clock { font-size: 17px; font-weight: 700; min-width: 7.5em; }
.grp { display: flex; gap: 2px; background: rgba(255,255,255,.07); border-radius: 6px; padding: 2px; }
.grp button {
  border: 0; background: transparent; color: var(--chrome-ink);
  min-width: 40px; height: 32px; border-radius: 4px; padding: 0 8px; font-size: 14px;
}
.grp button[aria-pressed="true"] { background: var(--chrome-ink); color: var(--chrome); font-weight: 700; }
#seatBtn, .barBtn {
  border: 1px solid rgba(230,233,223,.3); background: transparent; color: var(--chrome-ink);
  height: 34px; border-radius: 6px; padding: 0 10px; font-size: 14px;
}
.spacer { flex: 1; }

/* 地図 */
#map { position: fixed; left: 0; right: 0; bottom: 0; touch-action: none; display: block; background: var(--paper); }
#zoom { position: fixed; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
#zoom button {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); font-size: 20px; box-shadow: var(--shadow);
}

/* 自分の任務(左上の札) */
#orders {
  position: fixed; left: 12px; z-index: 10; max-width: min(380px, calc(100vw - 80px));
  background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--blue);
  border-radius: 4px; padding: 8px 12px; box-shadow: var(--shadow); font-size: 13px;
}
#orders.red { border-left-color: var(--red); }
#orders .who { font-weight: 700; font-size: 14px; }
#orders .mis { margin-top: 2px; }
#orders .obj { margin-top: 4px; color: var(--pencil); }
#orders button.link { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--pencil); font-size: 12px; }

/* 下の札(選んだ部隊) */
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  max-height: 58vh; overflow-y: auto;
  transform: translateY(105%); transition: transform .18s ease-out;
}
#sheet.open { transform: none; }
@media (min-width: 760px) {
  #sheet { left: auto; right: 12px; bottom: 12px; width: 380px; border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); max-height: 70vh; }
}
#sheet h2 { margin: 0; font-size: 18px; display: flex; align-items: baseline; gap: 8px; }
#sheet h2 small { font-size: 12px; font-weight: 400; color: var(--pencil); }
#sheet .close { float: right; border: 0; background: none; font-size: 22px; line-height: 1; padding: 0 4px; color: var(--pencil); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; margin: 10px 0 6px; }
.stat { font-size: 12px; color: var(--pencil); }
.stat b { display: block; font-size: 17px; color: var(--ink); }
.meter { height: 4px; background: var(--paper-2); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); }
.row { margin: 6px 0; font-size: 14px; }
.row .k { color: var(--pencil); font-size: 12px; display: block; }
.note { font-size: 13px; color: var(--pencil); margin: 8px 0; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  min-height: 40px; border-radius: 6px; padding: 0 14px; font-size: 14px;
}
.btn.main { background: var(--ink); color: var(--paper); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }

/* 任務を書く */
.form { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.field { margin: 8px 0; }
.field > span { display: block; font-size: 12px; color: var(--pencil); margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  border: 1px solid var(--line); background: var(--paper); border-radius: 4px; min-height: 36px; padding: 0 10px; font-size: 13px;
}
.seg button[aria-pressed="true"] { border-color: var(--grease); background: var(--grease); color: #1e2b2f; font-weight: 700; }
.pickHint { font-size: 13px; padding: 8px 10px; border: 1px dashed var(--grease); border-radius: 4px; }

/* 記録 */
#logBox {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 25; width: min(420px, 100vw);
  background: var(--paper); border-left: 1px solid var(--line); box-shadow: -2px 0 0 rgba(0,0,0,.08);
  display: flex; flex-direction: column; transform: translateX(105%); transition: transform .18s ease-out;
}
#logBox.open { transform: none; }
#logBox header { display: flex; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px; border-bottom: 1px solid var(--line); }
#logBox header h2 { margin: 0; font-size: 16px; flex: 1; }
#logList { list-style: none; margin: 0; padding: 6px 0 20px; overflow-y: auto; flex: 1; }
#logList li { padding: 6px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 3.3em 1fr; gap: 8px; }
#logList time { color: var(--pencil); font-size: 12px; }
#logList li.order { background: rgba(217,165,32,.18); }
#logList li.lost span { color: var(--red); }
#logList li.win span { font-weight: 700; }
#logList li.spot span::before { content: "◆ "; color: var(--grease); }

/* 札(ダイアログ) */
.dlg { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(20,28,30,.5); padding: 16px; }
.dlg.open { display: flex; }
.dlg .card {
  background: var(--paper); color: var(--ink); border-radius: 6px; width: min(460px, 100%); max-height: 86vh; overflow-y: auto;
  padding: 18px 20px; box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.dlg h2 { margin: 0 0 8px; font-size: 18px; }
.dlg p { margin: 6px 0; }
.seatList { list-style: none; padding: 0; margin: 8px 0; }
.seatList li button {
  width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none;
  padding: 9px 6px; display: flex; gap: 8px; align-items: baseline;
}
.seatList li button[aria-current="true"] { background: rgba(217,165,32,.25); font-weight: 700; }
.seatList li button:disabled { opacity: .4; text-decoration: line-through; }
.seatList .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.seatList small { color: var(--pencil); margin-left: auto; font-weight: 400; }
.setRow { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
.setRow label { flex: 1; }

/* 始めの札 */
#intro .card { border-top: 6px solid var(--blue); }
#intro .lead { font-size: 22px; font-weight: 700; line-height: 1.35; margin: 2px 0 10px; }
#intro ol { padding-left: 1.3em; margin: 8px 0 14px; }

/* 知らせ */
#toast {
  position: fixed; left: 50%; z-index: 30; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); border-radius: 6px; padding: 8px 14px; font-size: 14px;
  max-width: min(520px, calc(100vw - 24px)); box-shadow: var(--shadow); display: none;
}
#toast.show { display: block; }

@media (prefers-reduced-motion: reduce) {
  #sheet, #logBox { transition: none; }
}
@media (max-width: 560px) {
  #title { font-size: 14px; }
  #clock { font-size: 15px; min-width: 0; }
  .grp button { min-width: 36px; padding: 0 6px; }
}
</style>
</head>
<body>
<header id="bar">
  <div id="title">ウォーゲーム(仮)<span id="ver"></span></div>
  <div id="clock">1日目 06:00</div>
  <div class="grp" role="group" aria-label="時間の速さ">
    <button id="playBtn" aria-label="進める">▶</button>
    <button data-speed="1" aria-pressed="false">×1</button>
    <button data-speed="10" aria-pressed="false">×10</button>
    <button data-speed="60" aria-pressed="true">×60</button>
  </div>
  <div class="spacer"></div>
  <button id="seatBtn">席:-</button>
  <button id="logBtn" class="barBtn">記録</button>
  <button id="setBtn" class="barBtn" aria-label="設定">設定</button>
</header>

<canvas id="map" aria-label="戦場の地図"></canvas>

<div id="orders"></div>
<div id="zoom">
  <button id="zin" aria-label="近づける">＋</button>
  <button id="zout" aria-label="遠ざける">−</button>
  <button id="zfit" aria-label="全体を見る">□</button>
</div>

<section id="sheet" aria-live="polite"></section>

<aside id="logBox" aria-label="記録">
  <header><h2>記録</h2><button class="btn" id="logClose">閉じる</button></header>
  <ul id="logList"></ul>
</aside>

<div id="toast" role="status"></div>

<div class="dlg" id="seatDlg" role="dialog" aria-modal="true" aria-labelledby="seatTtl">
  <div class="card">
    <h2 id="seatTtl">どの席に座りますか</h2>
    <p class="note">選んだ指揮官をあなたが動かします。ほかの指揮官は、上官も部下もAIが動かします。</p>
    <ul class="seatList" id="seatList"></ul>
    <div class="acts"><button class="btn" id="seatClose">閉じる</button></div>
  </div>
</div>

<div class="dlg" id="setDlg" role="dialog" aria-modal="true" aria-labelledby="setTtl">
  <div class="card">
    <h2 id="setTtl">設定</h2>
    <div class="setRow"><label for="seOn">効果音</label><input type="checkbox" id="seOn"></div>
    <div class="setRow"><label for="seVol">音量</label><input type="range" id="seVol" min="0" max="1" step="0.05"></div>
    <div class="setRow"><label>新しい戦場(地形が変わります)</label><button class="btn" id="newMap">新しく始める</button></div>
    <div class="setRow"><label>同じ戦場で最初から</label><button class="btn" id="restart">やり直す</button></div>
    <p class="note" id="verNote"></p>
    <div class="acts"><button class="btn main" id="setClose">閉じる</button></div>
  </div>
</div>

<div class="dlg open" id="intro" role="dialog" aria-modal="true" aria-labelledby="introTtl">
  <div class="card">
    <p class="note" id="introWho">青軍 第1師団長</p>
    <p class="lead" id="introTtl">政府の命令:北原の町を取れ</p>
    <ol>
      <li>部下の連隊長を選んで、任務を出します。任務は伝令が走って届けるので、届くまで時間がかかります。</li>
      <li>直接動かせるのは、司令部と偵察隊だけです。</li>
      <li>敵は、味方から見えているときだけ地図に出ます。森や町にいる敵は、近づかないと見えません。</li>
    </ol>
    <div class="acts"><button class="btn main" id="introGo">始める(止めた状態で)</button><button class="btn" id="introSeat">席を変える</button></div>
  </div>
</div>

<script>
/* ===== 決まりの計算(画面に依存しない) ===== */
(function (root) {
'use strict';

var VERSION = '2026-10-12 r1';
var MAP = 10000;          // 地図の一辺(m)
var CELL = 100;           // 計算用の見えない升目(m)
var N = MAP / CELL;       // 一辺の升目の数

var PLAIN = 0, FOREST = 1, TOWN = 2, WATER = 3;
var TERR = [
  { name: '平地', speed: 1.0,  conceal: 0.0, defense: 1.0, block: 0 },
  { name: '森',   speed: 0.45, conceal: 0.7, defense: 0.6, block: 15 },
  { name: '町',   speed: 0.8,  conceal: 0.5, defense: 0.5, block: 10 },
  { name: '川',   speed: 0,    conceal: 0.0, defense: 1.0, block: 0 }
];
var ROAD_SPEED = 1.6, FORD_SPEED = 0.3;

var UNIT_TYPES = {
  inf:     { name: '歩兵大隊', speed: 55,  sight: 3000, range: 800, fire: 1.0 },
  recon:   { name: '偵察隊',   speed: 220, sight: 5000, range: 500, fire: 0.5 },
  hq:      { name: '司令部',   speed: 80,  sight: 2500, range: 300, fire: 0.3 }
};
var COURIER_SPEED = 400;  // 伝令(m/分)
var COURIER_CATCH = 250;  // 敵にこれより近づくと捕まる
var START_HOUR = 6;

/* --- 乱数(同じ種なら同じ結果) --- */
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNoise(r, step) {
  var g = Math.ceil(N / step) + 3, v = [];
  for (var i = 0; i < g * g; i++) v.push(r());
  return function (x, y) {
    var gx = x / step, gy = y / step, x0 = Math.floor(gx), y0 = Math.floor(gy);
    var fx = gx - x0, fy = gy - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = v[y0 * g + x0], b = v[y0 * g + x0 + 1], c = v[(y0 + 1) * g + x0], d = v[(y0 + 1) * g + x0 + 1];
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

/* --- 地図 --- */
function emptyMap() {
  return {
    n: N, cell: CELL, size: MAP,
    terr: new Uint8Array(N * N), h: new Float32Array(N * N),
    road: new Uint8Array(N * N), ford: new Uint8Array(N * N),
    towns: [], roadLines: [], riverPts: []
  };
}
function cellOf(v) { return clamp(Math.floor(v / CELL), 0, N - 1); }
function idxAt(x, y) { return cellOf(y) * N + cellOf(x); }
function terrAt(map, x, y) { return map.terr[idxAt(x, y)]; }
function hAt(map, x, y) { return map.h[idxAt(x, y)]; }
function cellSpeed(map, i) {
  if (map.road[i]) return ROAD_SPEED;
  if (map.terr[i] === WATER) return map.ford[i] ? FORD_SPEED : 0;
  return TERR[map.terr[i]].speed;
}
function passable(map, i) { return cellSpeed(map, i) > 0; }

function drawLine(map, ax, ay, bx, by, fn) {
  // 升目の上を、すき間なく線でなぞる
  var x = ax, y = ay, dx = Math.abs(bx - ax), dy = Math.abs(by - ay);
  var sx = ax < bx ? 1 : -1, sy = ay < by ? 1 : -1, err = dx - dy;
  for (;;) {
    fn(x, y);
    if (x === bx && y === by) break;
    var e2 = 2 * err;
    if (e2 > -dy && e2 < dx) { // 斜めに進むときは、角を埋める
      if (Math.abs(e2 + dy) < Math.abs(dx - e2)) { err -= dy; x += sx; } else { err += dx; y += sy; }
      fn(x, y);
      continue;
    }
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}

function genMap(seed) {
  var r = rng(seed || 1), map = emptyMap();
  var n1 = makeNoise(r, 26), n2 = makeNoise(r, 11), n3 = makeNoise(r, 4), nf = makeNoise(r, 8), nf2 = makeNoise(r, 3);
  var phase = r() * 6.28, i, x, y;
  // 高さ
  for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
    map.h[y * N + x] = 40 + 70 * n1(x, y) + 28 * n2(x, y) + 7 * n3(x, y);
  }
  // 川(西から東へ蛇行)
  var riverY = [];
  for (x = 0; x < N; x++) riverY.push(Math.round(50 + 7 * Math.sin(x / 13 + phase) + 3 * Math.sin(x / 5 + phase * 2)));
  for (x = 0; x < N; x++) map.riverPts.push({ x: (x + 0.5) * CELL, y: (riverY[x] + 0.5) * CELL });
  for (x = 0; x < N; x++) {
    var y0 = riverY[x], y1 = x > 0 ? riverY[x - 1] : y0;
    for (y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) map.terr[y * N + x] = WATER;
  }
  // 川沿いを低く(谷)
  for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
    var d = Math.abs(y - riverY[x]);
    map.h[y * N + x] -= 30 * Math.exp(-d / 5);
    if (map.terr[y * N + x] === WATER) map.h[y * N + x] = Math.min(map.h[y * N + x], 30);
  }
  // 町
  var towns = [
    { name: '北原', cx: 50, cy: 28, r: 3 },
    { name: '南野', cx: 46, cy: 84, r: 3 },
    { name: '西谷', cx: 16, cy: 38, r: 2 },
    { name: '東坂', cx: 82, cy: 66, r: 2 }
  ];
  towns.forEach(function (t) {
    for (y = t.cy - t.r; y <= t.cy + t.r; y++) for (x = t.cx - t.r; x <= t.cx + t.r; x++) {
      if (x < 0 || y < 0 || x >= N || y >= N) continue;
      if ((x - t.cx) * (x - t.cx) + (y - t.cy) * (y - t.cy) <= t.r * t.r + 1 && map.terr[y * N + x] !== WATER) map.terr[y * N + x] = TOWN;
    }
    map.towns.push({ name: t.name, x: (t.cx + 0.5) * CELL, y: (t.cy + 0.5) * CELL, r: (t.r + 0.5) * CELL });
  });
  // 森
  for (i = 0; i < N * N; i++) {
    if (map.terr[i] !== PLAIN) continue;
    x = i % N; y = (i / N) | 0;
    var f = nf(x, y) * 0.8 + nf2(x, y) * 0.2 + (map.h[i] > 105 ? 0.08 : 0);
    if (f > 0.6) map.terr[i] = FOREST;
  }
  // 道(川を渡るところは橋)
  function road(a, b) {
    var A = towns[a], B = towns[b];
    map.roadLines.push([(A.cx + 0.5) * CELL, (A.cy + 0.5) * CELL, (B.cx + 0.5) * CELL, (B.cy + 0.5) * CELL]);
    drawLine(map, A.cx, A.cy, B.cx, B.cy, function (x, y) { map.road[y * N + x] = map.terr[y * N + x] === WATER ? 2 : 1; });
  }
  road(1, 0); road(1, 3); road(3, 0); road(2, 0); road(2, 1);
  // 浅瀬(道のない渡れる場所。別働隊の抜け道)
  var fx = 30;
  for (y = 0; y < N; y++) if (map.terr[y * N + fx] === WATER) { map.ford[y * N + fx] = 1; }
  return map;
}

/* --- 道のり探し(見えない升目の上で最も速い道) --- */
function Heap() { this.a = []; }
Heap.prototype.push = function (k, v) {
  var a = this.a; a.push([k, v]); var i = a.length - 1;
  while (i > 0) { var p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; var t = a[p]; a[p] = a[i]; a[i] = t; i = p; }
};
Heap.prototype.pop = function () {
  var a = this.a, top = a[0], last = a.pop();
  if (a.length) {

  var st = R.objectiveStatus(w) || { town: '目標', holder: 'none' };
  var holder = { blue: '青軍が押さえている', red: '赤軍が押さえている', contested: '両軍がぶつかっている', none: '誰もいない' }[st.holder];
  var from = me.mission && me.mission.from === 'gov' ? '政府' : me.mission && R.getCmd(w, me.mission.from) ? R.getCmd(w, me.mission.from).title : '';
  box.className = me.side === 'red' ? 'red' : '';
  box.innerHTML = '<div class="who">' + esc(me.title) + '(' + R.personality(me) + ')</div>' +
    '<div class="mis">' + (from ? esc(from) + 'からの任務:' : '') + esc(R.missionText(w, me.mission)) + '</div>' +
    '<div class="obj">' + esc(st.town) + ':' + holder + '</div>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* --- 下の札 --- */
function relation(w, u) {
  var me = R.playerCmd(w); if (!me) return { kind: 'none' };
  if (me.units.indexOf(u.id) >= 0) return { kind: 'direct' };
  var c = R.getCmd(w, u.cmd);
  if (c && c.hq === u.id && c.parent === me.id) return { kind: 'sub', cmd: c };
  if (c && c.id === me.id) return { kind: 'direct' };
  return { kind: 'other', cmd: c };
}
function pendingFor(w, cmdId) { return w.couriers.filter(function (k) { return k.to === cmdId && k.alive; }).length; }
function renderSheet() {
  var w = S.w, el = $('sheet');
  if (!S.sel) { el.classList.remove('open'); el.innerHTML = ''; return; }
  var html = '';
  if (S.sel.kind === 'known') {
    var me0 = R.playerCmd(w), side = me0 ? me0.side : 'blue', k = w.known[side][S.sel.id];
    if (!k) { S.sel = null; return renderSheet(); }
    var now = !!w.vis[side][k.id], ago = w.time - k.t;
    html = '<button class="close" data-act="close" aria-label="閉じる">×</button>' +
      '<h2>敵の' + R.UNIT_TYPES[k.type].name + '<small>' + (now ? '今見えている' : '最後に見たのは' + (ago < 60 ? ago + '分前' : Math.floor(ago / 60) + '時間前')) + '</small></h2>' +
      '<div class="row"><span class="k">数(見た目の見積もり)</span>約' + k.est + '人</div>' +
      '<div class="row"><span class="k">場所</span>' + esc(R.placeName(w, k.x, k.y)) + '・' + R.TERR[R.terrAt(w.map, k.x, k.y)].name + '</div>' +
      (now ? '' : '<p class="note">今もそこにいるとは限りません。</p>');
    el.innerHTML = html; el.classList.add('open'); return;
  }
  var u = R.getUnit(w, S.sel.id);
  if (!u) { S.sel = null; return renderSheet(); }
  var c = R.getCmd(w, u.cmd), rel = relation(w, u);
  var lead = c && c.hq === u.id ? c : c;
  var stat = function (k, v, f) { return '<div class="stat">' + k + '<b>' + v + '</b>' + (f != null ? '<div class="meter"><i style="width:' + Math.round(f * 100) + '%"></i></div>' : '') + '</div>'; };
  html += '<button class="close" data-act="close" aria-label="閉じる">×</button>';
  html += '<h2>' + esc(u.name) + '<small>' + R.UNIT_TYPES[u.type].name + (u.alive ? '' : '・壊滅') + '</small></h2>';
  html += '<div class="stats">' + stat('人数', Math.round(u.str) + '人', u.str / u.max) + stat('疲れ', Math.round(u.fat), u.fat / 100) + stat('士気', Math.round(u.mor), u.mor / 100) + '</div>';
  html += '<div class="row"><span class="k">いる場所</span>' + esc(R.placeName(w, u.x, u.y)) + '・' + R.TERR[R.terrAt(w.map, u.x, u.y)].name + '</div>';
  if (u.note) html += '<div class="row"><span class="k">ようす</span>' + esc(u.note) + '</div>';
  if (lead) {
    var up = lead.parent ? R.getCmd(w, lead.parent) : null;
    html += '<div class="row"><span class="k">指揮官</span>' + esc(lead.title) + '(' + R.personality(lead) + ')' + (up ? '・上官は' + esc(up.title) : '') + (lead.ctrl === 'player' ? '・あなた' : '') + '</div>';
    html += '<div class="row"><span class="k">今の任務</span>' + esc(R.missionText(w, lead.mission)) + '</div>';
    var pend = pendingFor(w, lead.id);
    if (pend) html += '<p class="note">この指揮官あての伝令が' + pend + '人、向かっています。</p>';
  }
  if (!u.alive) { /* 何もしない */ }
  else if (rel.kind === 'direct') {
    if (S.pick === 'move') html += '<div class="form"><div class="pickHint">地図をタップして、行き先を選んでください。</div><div class="acts"><button class="btn" data-act="cancelPick">やめる</button></div></div>';
    else html += '<div class="acts"><button class="btn main" data-act="move">ここへ動かす(すぐ届く)</button>' + (u.dest ? '<button class="btn" data-act="stop">止まる</button>' : '') + '</div>' +
      (u.broken ? '<p class="note">崩れているので、命令を聞きません。</p>' : '');
  } else if (rel.kind === 'sub') {
    if (S.form && S.form.to === rel.cmd.id) html += formHtml(w);
    else html += '<div class="acts"><button class="btn main" data-act="mission">' + esc(rel.cmd.title) + 'に任務を出す</button></div>';
  } else if (rel.kind === 'other') {
    html += '<p class="note">あなたの直接の部下ではありません。動かすには、この部隊の上官に任務を出します。</p>';
  }
  el.innerHTML = html; el.classList.add('open');
}
function formHtml(w) {
  var f = S.form;
  function seg(field, opts) {
    return '<div class="seg">' + opts.map(function (o) { return '<button data-f="' + field + '" data-v="' + o[0] + '" aria-pressed="' + (String(f[field]) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>';
  }
  var where = f.x == null ? '<div class="pickHint">地図をタップして、目標の場所を選んでください。</div>' : '<div class="row">' + esc(R.placeName(w, f.x, f.y)) + ' <button class="btn" data-act="repick" style="min-height:30px">選び直す</button></div>';
  return '<div class="form">' +
    '<div class="field"><span>種類</span>' + seg('type', [['advance', '進め'], ['hold', '守れ']]) + '</div>' +
    '<div class="field"><span>目標の場所</span>' + where + '</div>' +
    '<div class="field"><span>範囲</span>' + seg('r', [[300, '300m'], [600, '600m'], [1000, '1km']]) + '</div>' +
    '<div class="field"><span>期限</span>' + seg('deadline', [['none', 'なし'], [120, '2時間後'], [360, '6時間後'], [720, '12時間後']]) + '</div>' +
    '<div class="field"><span>優先すること</span>' + seg('priority', [['speed', '速さ'], ['safe', '損害を抑える']]) + '</div>' +
    '<div class="acts"><button class="btn main" data-act="send"' + (f.x == null ? ' disabled' : '') + '>伝令を出す</button><button class="btn" data-act="cancelForm">やめる</button></div>' +
    '</div>';
}
function onSheetClick(e) {
  var b = e.target.closest('button'); if (!b) return;
  var w = S.w, act = b.dataset.act;
  if (b.dataset.f) {
    var v = b.dataset.v; if (b.dataset.f === 'r') v = +v;
    S.form[b.dataset.f] = v; SE.play('tab'); renderSheet(); S.dirty = true; return;
  }
  var u = S.sel && S.sel.kind === 'unit' ? R.getUnit(w, S.sel.id) : null;
  if (act === 'close') { select(null); return; }
  if (act === 'move') { S.pick = 'move'; SE.play('tap'); renderSheet(); return; }
  if (act === 'cancelPick') { S.pick = null; renderSheet(); return; }
  if (act === 'stop' && u) { R.orderDirect(w, u.id, null); SE.play('tap'); renderSheet(); S.dirty = true; return; }
  if (act === 'mission' && u) { startForm(R.getCmd(w, u.cmd).id); return; }
  if (act === 'repick') { S.pick = 'mission'; S.form.x = null; S.form.y = null; renderSheet(); S.dirty = true; return; }
  if (act === 'cancelForm') { S.form = null; S.pick = null; renderSheet(); S.dirty = true; return; }
  if (act === 'send') { sendForm(); return; }
}
function startForm(cmdId) {
  var c = R.getCmd(S.w, cmdId);
  S.form = { to: cmdId, type: 'advance', x: null, y: null, r: 600, deadline: 'none', priority: 'speed' };
  if (c && c.mission && c.mission.from === R.playerCmd(S.w).id) { S.form.type = c.mission.type; S.form.r = c.mission.r; S.form.priority = c.mission.priority; }
  S.pick = 'mission'; SE.play('tap'); renderSheet(); S.dirty = true;
}
function sendForm() {
  var w = S.w, f = S.form, me = R.playerCmd(w);
  if (!f || f.x == null || !me) { SE.play('error'); return false; }
  var m = { type: f.type, x: Math.round(f.x), y: Math.round(f.y), r: f.r, deadline: f.deadline === 'none' ? null : w.time + (+f.deadline), priority: f.priority };
  var k = R.sendMission(w, me.id, f.to, m);
  if (!k) { toast('伝令を出せませんでした(届け先がいない)'); SE.play('error'); return false; }
  var to = R.getCmd(w, f.to);
  toast(to.title + 'へ伝令を出しました');
  SE.play('send');
  S.form = null; S.pick = null; renderSheet(); renderLog(); S.dirty = true;
  return true;
}

/* --- 記録 --- */
function renderLog() {
  var w = S.w, side = R.playerSide(w), ul = $('logList');
  if (!$('logBox').classList.contains('open')) return;
  var items = w.log.filter(function (l) { return l.side === side || l.side === 'all'; }).slice(-150).reverse();
  ul.innerHTML = items.length ? items.map(function (l) {
    var t = R.clockText(l.t).split(' ')[1];
    return '<li class="' + l.kind + '"><time>' + t + '</time><span>' + esc(l.text) + '</span></li>';
  }).join('') : '<li><time></time><span>まだ何も起きていません。▶で時間を進めます。</span></li>';
}

/* --- 席 --- */
function renderSeats() {
  var w = S.w, me = R.playerCmd(w), ul = $('seatList');
  function depth(c) { var d = 0; while (c && c.parent) { c = R.getCmd(w, c.parent); d++; } return d; }
  var order = [];
  function walk(c) { order.push(c); c.subs.forEach(function (id) { var s = R.getCmd(w, id); if (s) walk(s); }); }
  w.cmds.filter(function (c) { return !c.parent; }).forEach(walk);
  w.cmds.forEach(function (c) { if (order.indexOf(c) < 0) order.push(c); });
  ul.innerHTML = order.map(function (c) {
    var sw = c.side === 'blue' ? PAL.blue : PAL.red;
    return '<li><button data-seat="' + c.id + '" style="padding-left:' + (6 + depth(c) * 18) + 'px"' + (me && me.id === c.id ? ' aria-current="true"' : '') + (c.alive ? '' : ' disabled') + '>' +
      '<span class="sw" style="background:' + sw + '"></span>' + esc(c.title) + '<small>' + (c.side === 'blue' ? '青軍' : '赤軍') + '・' + R.personality(c) + '</small></button></li>';
  }).join('');
}
function chooseSeat(id) {
  if (!R.setPlayer(S.w, id)) return false;
  S.sel = null; S.form = null; S.pick = null;
  SE.play('tab');
  var me = R.playerCmd(S.w);
  toast(me.title + 'の席に座りました');
  renderAll();
  return true;
}

/* --- 知らせ --- */
var toastTimer = null;
function toast(text) {
  var t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
}
function drainEvents() {
  var w = S.w, side = R.playerSide(w), any = false;
  w.events.forEach(function (ev) {
    if (ev.side !== side && ev.side !== 'all') return;
    any = true;
    if (ev.kind === 'order') { toast(ev.text); SE.play('arrive'); }
    else if (ev.kind === 'spot') { if (w.time - S.lastSpotSE > 5) { SE.play('spot'); S.lastSpotSE = w.time; } }
    else if (ev.kind === 'lost') SE.play('lost');
    else if (ev.kind === 'win') { SE.play('win'); toast(ev.text); }
    else if (ev.kind === 'warn' && /あなた|捕まった/.test(ev.text)) toast(ev.text);
  });
  w.events = [];
  return any;
}

/* --- 選ぶ --- */
function select(sel) {
  S.sel = sel; S.pick = null;
  if (!sel) S.form = null;
  else if (S.form) { var u = sel.kind === 'unit' ? R.getUnit(S.w, sel.id) : null; if (!u || R.getCmd(S.w, u.cmd).id !== S.form.to) S.form = null; }
  renderSheet(); S.dirty = true;
}
function hitTest(sx, sy) {
  var w = S.w, side = R.playerSide(w), best = null, bd = 20;
  w.units.forEach(function (u) {
    if (!u.alive) return;
    if (u.side !== side && !w.vis[side][u.id]) return;
    var p = toScreen(u.x, u.y), d = Math.hypot(p.x - sx, p.y - sy) - (u.side === side ? 3 : 0);
    if (d < bd) { bd = d; best = u.side === side ? { kind: 'unit', id: u.id } : { kind: 'known', id: u.id }; }
  });
  var kn = w.known[side];
  Object.keys(kn).forEach(function (id) {
    var k = kn[id]; if (!k.alive || w.vis[side][id]) return;
    var p = toScreen(k.x, k.y), d = Math.hypot(p.x - sx, p.y - sy);
    if (d < bd) { bd = d; best = { kind: 'known', id: id }; }
  });
  return best;
}
function tapMap(sx, sy) {
  var w = S.w, p = toWorld(sx, sy);
  if (p.x < 0 || p.y < 0 || p.x > R.MAP || p.y > R.MAP) { if (!S.pick) select(null); return; }
  if (S.pick === 'mission' && S.form) {
    S.form.x = Math.round(p.x); S.form.y = Math.round(p.y); S.pick = null; SE.play('tap'); renderSheet(); S.dirty = true; return;
  }
  if (S.pick === 'move' && S.sel) {
    var ok = R.orderDirect(w, S.sel.id, p.x, p.y);
    S.pick = null; SE.play(ok ? 'send' : 'error'); if (!ok) toast('そこへは行けません'); renderSheet(); S.dirty = true; return;
  }
  var h = hitTest(sx, sy);
  if (h) SE.play('tap');
  select(h);
}

/* --- 地図の操作(ドラッグで動かす・つまんで拡大) --- */
var ptrs = {}, drag = null;
function onDown(e) {
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.offsetX, y: e.offsetY };
  var ids = Object.keys(ptrs);
  if (ids.length === 1) drag = { x: e.offsetX, y: e.offsetY, ox: S.view.ox, oy: S.view.oy, moved: false };
  else if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; drag = { pinch: Math.hypot(a.x - b.x, a.y - b.y), s: S.view.s, moved: true }; }
}
function onMove(e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.offsetX, y: e.offsetY };
  var ids = Object.keys(ptrs);
  if (!drag) return;
  if (drag.pinch && ids.length === 2) {
    var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(drag.s * d / drag.pinch / S.view.s, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (!drag.pinch) {
    var dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    if (drag.moved) { S.view.ox = drag.ox + dx; S.view.oy = drag.oy + dy; S.dirty = true; }
  }
}
function onUp(e) {
  var wasDrag = drag;
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length === 0) {
    if (wasDrag && !wasDrag.moved && !wasDrag.pinch) tapMap(e.offsetX, e.offsetY);
    drag = null;
  }
}

/* --- 時間 --- */
function setRunning(v) { S.running = v; S.clock.speed = v ? S.speed : 0; S.clock.last = null; renderBar(); S.dirty = true; }
function setSpeed(v) { S.speed = v; if (S.running) S.clock.speed = v; SE.play('tab'); renderBar(); }

/* --- 全部描き直す --- */
function renderAll() { renderBar(); renderOrders(); renderSheet(); renderLog(); S.dirty = true; }

var lastUi = 0;
function frame(now) {
  var n = S.clock.advance(now);
  if (n > 0) {
    drainEvents();
    if (now - lastUi > 250) { lastUi = now; renderBar(); renderOrders(); renderLog(); if (S.sel && !S.form) renderSheet(); }
    S.dirty = true;
  }
  if (S.running) S.dirty = true;
  if (S.dirty) draw();
  requestAnimationFrame(frame);
}

/* --- つなぐ --- */
function bind() {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function (e) { delete ptrs[e.pointerId]; drag = null; });
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.offsetX, e.offsetY); }, { passive: false });
  $('zin').onclick = function () { zoomAt(1.3, S.cw / 2, S.ch / 2); };
  $('zout').onclick = function () { zoomAt(1 / 1.3, S.cw / 2, S.ch / 2); };
  $('zfit').onclick = fitView;
  $('playBtn').onclick = function () { setRunning(!S.running); SE.play('tap'); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-speed]'), function (b) { b.onclick = function () { setSpeed(+b.dataset.speed); }; });
  $('sheet').addEventListener('click', onSheetClick);
  $('seatBtn').onclick = function () { renderSeats(); $('seatDlg').classList.add('open'); SE.play('tap'); };
  $('seatClose').onclick = function () { $('seatDlg').classList.remove('open'); };
  $('seatList').addEventListener('click', function (e) { var b = e.target.closest('[data-seat]'); if (!b) return; chooseSeat(b.dataset.seat); $('seatDlg').classList.remove('open'); $('intro').classList.remove('open'); });
  $('logBtn').onclick = function () { $('logBox').classList.toggle('open'); renderLog(); SE.play('tap'); };
  $('logClose').onclick = function () { $('logBox').classList.remove('open'); };
  $('setBtn').onclick = function () { $('seOn').checked = SE.on(); $('seVol').value = SE.vol(); $('verNote').textContent = '今開いている版:' + R.VERSION; $('setDlg').classList.add('open'); };
  $('setClose').onclick = function () { $('setDlg').classList.remove('open'); };
  $('seOn').onchange = function () { SE.setOn($('seOn').checked); SE.play('tap'); };
  $('seVol').oninput = function () { SE.setVol(+$('seVol').value); };
  $('seVol').onchange = function () { SE.play('tap'); };
  $('newMap').onclick = function () { newGame(Math.floor(Math.random() * 1e6) + 1, true); $('setDlg').classList.remove('open'); toast('新しい戦場で始めます'); };
  $('restart').onclick = function () { newGame(S.seed, true); $('setDlg').classList.remove('open'); toast('最初からやり直します'); };
  $('introGo').onclick = function () { $('intro').classList.remove('open'); SE.play('tap'); };
  $('introSeat').onclick = function () { renderSeats(); $('seatDlg').classList.add('open'); };
  window.addEventListener('resize', function () { layout(); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); setRunning(!S.running); }
    if (e.key === 'Escape') { if (S.pick) { S.pick = null; renderSheet(); } else select(null); document.querySelectorAll('.dlg.open').forEach(function (d) { if (d.id !== 'intro') d.classList.remove('open'); }); }
  });
}

bind();
newGame(S.seed);
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});

/* テスト用の窓口 */
window.__wargame = {
  rules: R, SE: SE,
  get world() { return S.w; }, get state() { return S; },
  newGame: newGame, setRunning: setRunning, setSpeed: setSpeed, chooseSeat: chooseSeat,
  select: select, startForm: startForm, sendForm: sendForm, tapWorld: function (x, y) { var p = toScreen(x, y); tapMap(p.x, p.y); },
  renderAll: renderAll, draw: function () { draw(); }, frame: function (ms) { var n = S.clock.advance(ms); if (n) { drainEvents(); renderAll(); } return n; }
};
})();
</script>
</body>
</html>
